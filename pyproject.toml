[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "service-center"
version = "25.0.0"
description = "Service Center Management System with Plugin Architecture"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "ServiceUP Team", email = "team@serviceup.local"}
]
keywords = [
    "service",
    "repair",
    "management",
    "plugin-architecture",
    "modular",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    # GUI
    "customtkinter>=5.2.0",
    "Pillow>=10.0.0",
    "ttkbootstrap>=1.10.0",
    # PDF
    "reportlab>=4.0.0",
    "pypdfium2>=4.0.0",
    "fpdf2>=2.7.0",
    # HTTP & Networking
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    # Web Server
    "flask>=3.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    # QR & Barcodes
    "qrcode>=7.4.0",
    "python-barcode>=0.15.0",
    # Data Validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "phonenumbers>=8.13.0",
    "python-dateutil>=2.8.0",
    "orjson>=3.9.0",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.19.0",
    # State Machine
    "transitions>=0.9.0",
    # Notifications
    "aiosmtplib>=3.0.0",
    # Logging
    "loguru>=0.7.0",
    "structlog>=24.1.0",
    # Configuration
    "python-dotenv>=1.0.0",
    "dynaconf>=3.2.0",
    # Dependency Injection
    "dependency-injector>=4.49.0",
    "injector>=0.22.0",
    # Plugin System
    "importlib-metadata>=7.0.0",
    "pluggy>=1.4.0",
    # Caching
    "cachetools>=5.3.0",
    # Security
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
    "passlib>=1.7.4",
    # Utils
    "tenacity>=8.2.0",
    "arrow>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "application*",
    "config*",
    "core*",
    "database*",
    "domain*",
    "events*",
    "features*",
    "gui*",
    "infrastructure*",
    "interfaces*",
    "managers*",
    "models*",
    "modules*",
    "plugins*",
    "presentation*",
    "pwa*",
    "reports*",
    "services*",
    "shared*",
    "specifications*",
    "utils*",
]
exclude = [
    "tests*",
    "tools*",
    "*.tests",
    "*__pycache__*",
]

[project.entry-points."serviceup.plugins"]
# Built-in plugins registration
clients = "plugins.clients:ClientsPlugin"
orders = "plugins.orders:OrdersPlugin"
reports = "plugins.reports:ReportsPlugin"
auth = "plugins.auth:AuthPlugin"
pwa = "plugins.pwa:PWAPlugin"

[project.entry-points."serviceup.modules"]
# Core modules
billing = "modules.billing:BillingModule"
dashboard = "modules.dashboard_main:DashboardModule"

[project.scripts]
serviceup = "main:main"
serviceup-dev = "bootstrap:dev_mode"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=."

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
# Target Python 3.14
target-version = "py314"

# Line length
line-length = 88

# Exclude directories
exclude = [
    ".git",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".venv",
]

[tool.ruff.lint]
# Enable all rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "G",      # flake8-logging-format
    "SIM",    # flake8-simplify
    "UP",     # pyupgrade
    "RUF",    # Ruff-specific rules
    "S",      # flake8-bandit (security)
    "BLE",    # flake8-blind-except
    "TRY",    # tryceratops
    "PL",     # Pylint
    "PERF",   # Perflint
]

# Ignore specific rules that conflict with project style
ignore = [
    "E501",   # line too long (handled by formatter)
    "D203",   # 1 blank line required before class docstring
    "D213",   # Multi-line docstring summary should start at the second line
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value comparison
]

# Fixable rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Tests can have assertions and magic values
"**/tests/**/*.py" = ["S101", "PLR2004"]
# Migrations can have raw SQL
"**/migrations/**/*.py" = ["S608"]
# Tools and scripts can use print
"tools/**/*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = [
    "application",
    "config",
    "core",
    "database",
    "domain",
    "events",
    "features",
    "gui",
    "infrastructure",
    "interfaces",
    "managers",
    "models",
    "modules",
    "plugins",
    "presentation",
    "pwa",
    "reports",
    "services",
    "shared",
    "specifications",
    "utils",
]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
