[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "service-center"
version = "1.0.0b12"
description = "Service Center Management System with Plugin Architecture"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "ServiceUP Team", email = "team@serviceup.local"}
]
keywords = [
    "service",
    "repair",
    "management",
    "plugin-architecture",
    "modular",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
# SSOT реальных зависимостей — requirements.txt (сверен с фактическими import/
# from по всей кодовой базе). Раньше здесь лежало ~50 пакетов, из которых
# используется меньше трети (redis/celery/fastapi/uvicorn/alembic/aiosqlite/
# transitions/aiosmtplib/injector/dynaconf/loguru/structlog/pyjwt/passlib/
# cachetools/aioredis/tenacity/arrow/factory-boy/ttkbootstrap/python-barcode/
# orjson/dependency-injector/httpx/aiohttp/fpdf2/python-dotenv/bcrypt/
# cryptography и т.д. никогда не импортировались) — список здесь разошёлся с
# requirements.txt и вводил в заблуждение "pip install -e ." (см. requirements.txt
# для полного комментария по каждой группе).
dependencies = [
    "customtkinter>=5.2.0",
    "Pillow>=10.0.0",
    "reportlab>=4.0.0",
    "pypdfium2>=4.0.0",
    "requests>=2.31.0",
    "flask>=3.0.0",
    "qrcode>=7.4.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "phonenumbers>=8.13.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "application*",
    "config*",
    "core*",
    "database*",
    "domain*",
    "events*",
    "features*",
    "gui*",
    "infrastructure*",
    "interfaces*",
    "managers*",
    "models*",
    "modules*",
    "plugins*",
    "presentation*",
    "pwa*",
    "reports*",
    "services*",
    "shared*",
    "specifications*",
    "utils*",
]
exclude = [
    "tests*",
    "tools*",
    "*.tests",
    "*__pycache__*",
]

[project.entry-points."serviceup.plugins"]
# Built-in plugins registration
clients = "plugins.clients:ClientsPlugin"
orders = "plugins.orders:OrdersPlugin"
reports = "plugins.reports:ReportsPlugin"
auth = "plugins.auth:AuthPlugin"
pwa = "plugins.pwa:PWAPlugin"

[project.entry-points."serviceup.modules"]
# Core modules
billing = "modules.billing:BillingModule"
dashboard = "modules.dashboard_main:DashboardModule"

[project.scripts]
serviceup = "main:main"
serviceup-dev = "bootstrap:dev_mode"

[tool.pytest.ini_options]
# asyncio_mode="auto" (pytest-asyncio option) убран — pytest-asyncio не
# установлен и в проекте нет async-тестов; опция только сыпала
# PytestConfigWarning: Unknown config option на каждый прогон.
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# --cov=. в addopts требовал -o addopts="" на каждый локальный "прогони один
# тест"; покрытие теперь явный флаг (см. CI: `pytest --cov=. --cov-report=term`).
addopts = "--tb=short -ra"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
# Target Python 3.14
target-version = "py314"

# Line length
line-length = 88

# Exclude directories
exclude = [
    ".git",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".venv",
]

[tool.ruff.lint]
# Enable all rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "G",      # flake8-logging-format
    "SIM",    # flake8-simplify
    "UP",     # pyupgrade
    "RUF",    # Ruff-specific rules
    "S",      # flake8-bandit (security)
    "BLE",    # flake8-blind-except
    "TRY",    # tryceratops
    "PL",     # Pylint
    "PERF",   # Perflint
]

# Ignore specific rules that conflict with project style
ignore = [
    "E501",   # line too long (handled by formatter)
    "D203",   # 1 blank line required before class docstring
    "D213",   # Multi-line docstring summary should start at the second line
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value comparison
]

# Fixable rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Tests can have assertions and magic values
"**/tests/**/*.py" = ["S101", "PLR2004"]
# Migrations can have raw SQL
"**/migrations/**/*.py" = ["S608"]
# Tools and scripts can use print
"tools/**/*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = [
    "application",
    "config",
    "core",
    "database",
    "domain",
    "events",
    "features",
    "gui",
    "infrastructure",
    "interfaces",
    "managers",
    "models",
    "modules",
    "plugins",
    "presentation",
    "pwa",
    "reports",
    "services",
    "shared",
    "specifications",
    "utils",
]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
