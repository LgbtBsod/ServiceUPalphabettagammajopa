[tool.ruff]
# Target Python 3.14
target-version = "py314"

# Line length
line-length = 88

# Exclude directories
exclude = [
    ".git",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable all rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "G",      # flake8-logging-format
    "SIM",    # flake8-simplify
    "UP",     # pyupgrade
    "RUF",    # Ruff-specific rules
    "S",      # flake8-bandit (security)
    "BLE",    # flake8-blind-except
    "TRY",    # tryceratops
    "PL",     # Pylint
    "PERF",   # Perflint
]

# Ignore specific rules that conflict with project style
ignore = [
    "E501",   # line too long (handled by formatter)
    "D203",   # 1 blank line required before class docstring
    "D213",   # Multi-line docstring summary should start at the second line
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value comparison
]

# Fixable rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Tests can have assertions and magic values
"**/tests/**/*.py" = ["S101", "PLR2004"]
# Migrations can have raw SQL
"**/migrations/**/*.py" = ["S608"]
# Tools and scripts can use print
"tools/**/*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = [
    "application",
    "config",
    "core",
    "database",
    "domain",
    "events",
    "features",
    "gui",
    "infrastructure",
    "interfaces",
    "managers",
    "models",
    "modules",
    "plugins",
    "presentation",
    "pwa",
    "reports",
    "services",
    "shared",
    "specifications",
    "utils",
]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
