name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: version.txt matches release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d ' \t\r\n' < version.txt | sed 's/^v//')"
          echo "tag=$tag  version.txt=$file"
          if [ "$tag" != "$file" ]; then
            echo "::error::version.txt ($file) != tag ($tag) — обнови version.txt перед тегом"
            exit 1
          fi
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest -q

  build:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: ServiceUP-windows.exe
            artifact: dist/ServiceUP.exe
          - os: ubuntu-latest
            asset: ServiceUP-linux
            artifact: dist/ServiceUP
          - os: macos-latest
            asset: ServiceUP-macos
            artifact: dist/ServiceUP
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build executable
        run: python build.py --clean

      - name: Stage asset
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.artifact }}" "out/${{ matrix.asset }}"
          cp version.txt "out/version.txt"
          ( cd out && sha256sum "${{ matrix.asset }}" | tee "${{ matrix.asset }}.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/${{ matrix.asset }}
            out/${{ matrix.asset }}.sha256
            out/version.txt
          fail_on_unmatched_files: false
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'b') || contains(github.ref_name, 'a') || contains(github.ref_name, 'rc') }}
